<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="logo/favicon.png?v=2">
<link rel="shortcut icon" type="image/png" href="logo/favicon.png?v=2">
<link rel="apple-touch-icon" href="logo/favicon.png?v=2">
<title>Meridian · Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ══ Client Portal V3 visual system (2026-09 Phase 9) ══
     Complete visual/UX redesign: cool-neutral, blue-led SaaS design
     language (Linear/Stripe/Vercel-adjacent) replacing the previous
     warm/orange-heavy V2 system. Novara orange (#FF5B04) is kept only
     as a restrained brand accent (the real wordmark logo carries it) —
     it is no longer the interactive/primary colour anywhere in the UI.
     Same Poppins typography and 1180px content rhythm as before; token
     *names* mostly unchanged so JS-generated markup needed minimal
     structural edits, only re-themed. */
  :root{
    --bg:#F6F7FA; --card:#FFFFFF; --surface-2:#F1F4F9; --surface-3:#E9EDF4;
    --t1:#0F172A; --t2:#586274; --t3:#94A3B8; --t4:#C7D0DC;
    --b1:#E7EAF1; --b2:#D6DCE6;
    --accent:#2563EB; --accent-2:#1D4ED8; --accent-soft:#EAF1FF;
    --accent-grad:linear-gradient(135deg,#2563EB,#3B82F6);
    --brand:#FF5B04; --brand-soft:#FFF0E6;
    --success:#16A34A; --success-bg:rgba(22,163,74,.09);
    --warn:#B45309; --warn-bg:rgba(180,83,9,.10);
    --serious:#C2410C; --serious-bg:rgba(194,65,12,.10);
    --danger:#DC2626; --danger-bg:rgba(220,38,38,.08);
    /* Categorical — cool palette, used only for genuine categorisation
       (service tags, report types), never as the primary interactive colour */
    --cat-blue:#2563EB; --cat-blue-bg:rgba(37,99,235,.10);
    --cat-orange:var(--accent); --cat-orange-bg:var(--accent-soft);
    --cat-aqua:#0D9488; --cat-aqua-bg:rgba(13,148,136,.10);
    --cat-amber:#D97706; --cat-amber-bg:rgba(217,119,6,.10);
    --cat-magenta:#DB2777; --cat-magenta-bg:rgba(219,39,119,.10);
    --cat-green:#16A34A; --cat-green-bg:rgba(22,163,74,.09);
    --cat-violet:#7C3AED; --cat-violet-bg:rgba(124,58,237,.10);
    --cat-red:#DC2626; --cat-red-bg:rgba(220,38,38,.10);
    --font-display:'Poppins',ui-sans-serif,-apple-system,sans-serif;
    --font-body:'Poppins',ui-sans-serif,-apple-system,sans-serif;
    --radius:16px; --radius-lg:20px; --radius-sm:10px; --pad-x:20px; --card-gap:18px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow:0 1px 2px rgba(15,23,42,.03),0 8px 24px -10px rgba(15,23,42,.10);
    --shadow-lg:0 24px 56px -16px rgba(15,23,42,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-body);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,textarea{font-family:inherit;font-size:14px}
  a{color:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--b2);border-radius:8px}

  /* ---------- Auth screens ---------- */
  .auth-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(120% 120% at 0% 0%,#EEF3FF 0%,var(--bg) 46%,var(--bg) 100%)}
  .auth-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--b1);border-radius:var(--radius-lg);
    padding:40px 36px;box-shadow:var(--shadow-lg)}
  .brand{display:flex;align-items:center;margin-bottom:30px}
  .brand-logo{height:26px;width:auto;display:block}
  .auth-h{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;font-family:var(--font-display)}
  .auth-sub{color:var(--t2);margin-bottom:24px;font-size:14px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--b1);border-radius:var(--radius-sm);background:#fff;
    font-family:inherit;font-size:14px;color:var(--t1);box-sizing:border-box;transition:border .15s,box-shadow .15s}
  .field textarea{resize:vertical;min-height:80px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--radius-sm);
    font-weight:600;font-size:14px;line-height:1;transition:transform .08s,box-shadow .15s,background .15s,border-color .15s,opacity .15s;font-family:var(--font-body)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55;cursor:not-allowed;pointer-events:none}
  .btn svg{width:15px;height:15px;flex-shrink:0}
  .btn-primary{background:var(--accent-grad);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.28)}
  .btn-primary:hover{background:var(--accent-2);box-shadow:0 2px 12px rgba(37,99,235,.36)}
  .btn-block{width:100%}
  .btn-ghost{background:var(--card);border:1px solid var(--b1);color:var(--t1)}
  .btn-ghost:hover{background:var(--surface-2);border-color:var(--b2)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger:hover{background:#B91C1C}
  .err{background:var(--danger-bg);border:1px solid rgba(220,38,38,.25);color:var(--danger);padding:10px 12px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;display:none}
  .err.show{display:block}

  /* ---------- App shell ---------- */
  .shell{display:none;min-height:100%}
  .shell.show{display:grid;grid-template-columns:264px 1fr}
  .side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--b1);
    padding:26px 18px 18px;display:flex;flex-direction:column;gap:2px}
  .side .brand{margin:2px 8px 30px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;margin-bottom:2px;border-radius:var(--radius-sm);color:var(--t2);
    font-weight:600;font-size:14px;transition:background .12s,color .12s;font-family:var(--font-body)}
  .nav-item svg{width:19px;height:19px;flex-shrink:0;opacity:.85}
  .nav-item:hover{background:var(--surface-2);color:var(--t1)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent)}
  .nav-item.active svg{opacity:1}
  .nav-spacer{flex:1}
  .side-foot{padding-top:14px;margin-top:8px;border-top:1px solid var(--b1)}
  .me-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);background:var(--surface-2)}
  .me-av{width:34px;height:34px;border-radius:50%;background:var(--accent-grad);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
  .me-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .me-sub{font-size:11px;color:var(--t3)}

  .main{min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .topbar{height:64px;flex-shrink:0;background:rgba(255,255,255,.86);backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
  .pg-title{font-size:13.5px;font-weight:600;color:var(--t2);letter-spacing:-.01em;font-family:var(--font-display)}
  .tb-right{display:flex;align-items:center;gap:10px}
  .bell{position:relative;width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--t2)}
  .bell:hover{background:var(--surface-2);color:var(--t1)}
  .bell svg{width:19px;height:19px}
  .bell .dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);
    color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;border:2px solid var(--card)}
  .bell .dot.show{display:flex}
  .content{flex:1;overflow-y:auto;padding:32px 28px}
  .content-inner{max-width:1180px;margin:0 auto}

  .page-head{margin-bottom:24px}
  .page-head h1{font-size:23px;font-weight:700;letter-spacing:-.02em;font-family:var(--font-display);color:var(--t1)}
  .page-head p{font-size:13.5px;color:var(--t3);margin-top:3px;font-weight:500}

  .preview-banner{background:var(--warn-bg);border-bottom:1px solid rgba(180,83,9,.25);color:var(--warn);font-size:13px;font-weight:600;
    padding:9px 28px;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px}
  .preview-banner svg{width:15px;height:15px;flex-shrink:0}

  /* ---------- Cards / grids ---------- */
  .card{background:var(--card);border:1px solid var(--b1);border-radius:var(--radius);box-shadow:var(--shadow)}
  .grid{display:grid;gap:var(--card-gap)}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:22px}
  .kpi{padding:20px;display:flex;flex-direction:column;gap:12px}
  .kpi .kpi-ico{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center}
  .kpi .kpi-ico svg{width:18px;height:18px}
  .kpi .v{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1;font-family:var(--font-display)}
  .kpi .l{color:var(--t2);font-size:12.5px;font-weight:500;margin-top:1px}
  .sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:32px 0 16px}
  .sec-h .t{font-size:15px;font-weight:600;color:var(--t1);font-family:var(--font-display);letter-spacing:-.01em}
  .sec-h .sub{font-size:12px;color:var(--t3);font-weight:500;margin-top:1px}
  .sec-h .link{font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap}
  .sec-h .link:hover{color:var(--accent-2)}

  /* ---------- Client health summary ---------- */
  .health-card{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;padding:24px 28px}
  .hc-ring{position:relative;width:76px;height:76px;flex-shrink:0}
  .hc-ring .hc-score{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .hc-ring .hc-score b{font-size:19px;font-weight:700;letter-spacing:-.02em;font-family:var(--font-display)}
  .hc-ring .hc-score span{font-size:9px;color:var(--t3);font-weight:600}
  .hc-eyebrow{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
  .hc-name{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:9px;font-family:var(--font-display);color:var(--t1)}
  .health-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
  .hc-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end;text-align:right;max-width:200px}
  .hc-reason{font-size:12px;color:var(--t2);font-weight:500}

  .projects{grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
  .proj{padding:20px}
  .proj-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .pring{width:52px;height:52px;flex-shrink:0;position:relative}
  .pring .pv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--font-display)}
  .proj-title{font-weight:600;font-size:15px;font-family:var(--font-display)}
  .proj-status{font-size:11.5px;font-weight:600;margin-top:2px}
  .avs{display:flex;margin-top:4px}
  .avs .av{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-left:-7px;background:var(--b2);
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;overflow:hidden}
  .avs .av:first-child{margin-left:0}
  .avs .av img{width:100%;height:100%;object-fit:cover}

  /* ---------- Completed Work ---------- */
  .cw-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .cw-item{padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
  .cw-ico{width:32px;height:32px;border-radius:var(--radius-sm);flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--success-bg);color:var(--success)}
  .cw-ico svg{width:16px;height:16px}
  .cw-title{font-weight:600;font-size:13.5px;font-family:var(--font-display);line-height:1.35}
  .cw-meta{font-size:11.5px;color:var(--t3);margin-top:4px;font-weight:500}

  /* ---------- Performance / mini charts ---------- */
  .perf-grid{grid-template-columns:1.3fr 1fr}
  .perf-card{padding:20px}
  .perf-card .ph{font-size:12.5px;font-weight:700;color:var(--t2);margin-bottom:14px}
  .metric-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--b1)}
  .metric-row:last-child{border-bottom:none}
  .metric-row .ml{font-size:12.5px;color:var(--t2);font-weight:500}
  .metric-row .mv{font-size:15px;font-weight:700;font-family:var(--font-display)}
  .spark-bars{display:flex;align-items:flex-end;gap:6px;height:72px;margin-top:4px}
  .spark-bars .sb{flex:1;background:var(--accent);opacity:.85;border-radius:4px 4px 0 0;min-height:3px}
  .spark-labels{display:flex;gap:6px;margin-top:6px}
  .spark-labels span{flex:1;text-align:center;font-size:9.5px;color:var(--t3);font-weight:600}
  .donut-mini-wrap{display:flex;align-items:center;gap:16px}
  .donut-legend-mini{display:flex;flex-direction:column;gap:6px;font-size:12px}
  .donut-legend-mini .dl-row{display:flex;align-items:center;gap:7px}
  .donut-legend-mini .dl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .donut-legend-mini .dl-l{color:var(--t2);font-weight:500}
  .donut-legend-mini .dl-v{font-weight:700;margin-left:auto;padding-left:10px}

  /* ---------- GTM Performance (Phase 6, extended Phase 8, restyled Phase 9) ---------- */
  .gtm-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:8px}
  .gtm-card{padding:18px}
  .gtm-title{font-weight:600;font-size:13px;font-family:var(--font-display);line-height:1.3}
  .gtm-service{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--cat-violet);margin-top:4px}
  .gtm-value{font-size:20px;font-weight:700;letter-spacing:-.01em;font-family:var(--font-display);margin-top:10px}
  .gtm-bar-track{height:5px;border-radius:3px;background:var(--surface-3);margin-top:10px;overflow:hidden}
  .gtm-bar-fill{height:100%;border-radius:3px;background:var(--accent)}
  .gtm-goal-meta{font-size:10.5px;color:var(--t3);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .gtm-status-chip{background:var(--success-bg);color:var(--success);font-weight:700;text-transform:capitalize;padding:2px 8px;border-radius:10px;font-size:10px}
  .gtm-leads-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .gtm-lead-card{padding:15px 17px;transition:border-color .12s}
  .gtm-lead-card:hover{border-color:var(--b2)}
  .gtm-lead-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .gtm-lead-name{font-weight:600;font-size:13.5px;font-family:var(--font-display)}
  .gtm-stage-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;white-space:nowrap;flex-shrink:0}
  .gtm-lead-company{font-size:11.5px;color:var(--t3);margin-top:2px}
  .gtm-lead-meta{font-size:11.5px;color:var(--t2);margin-top:8px;font-weight:500}
  .gtm-lead-date{font-size:10.5px;color:var(--t3);margin-top:4px}
  .gtm-stage-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
  .gtm-stage-bar>div{min-width:4px}
  .gtm-stage-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
  .gtm-stage-leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);font-weight:500}
  .gtm-stage-leg b{color:var(--t1);font-weight:700}

  /* ---------- Reports ---------- */
  .rp-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .rp-card{padding:20px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .rp-card:hover{border-color:var(--b2);box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -12px rgba(15,23,42,.14)}
  .rp-type{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--cat-violet);background:var(--cat-violet-bg);padding:3px 9px;border-radius:7px;margin-bottom:10px}
  .rp-title{font-weight:600;font-size:15px;font-family:var(--font-display);line-height:1.3;margin-bottom:6px}
  .rp-period{font-size:12px;color:var(--t3);font-weight:500;margin-bottom:10px}
  .rp-summary{font-size:12.5px;color:var(--t2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .rp-detail-sec{margin-bottom:22px}
  .rp-detail-sec h3{font-size:13px;font-weight:700;color:var(--t1);font-family:var(--font-display);margin-bottom:8px}
  .rp-detail-sec .body{font-size:13.5px;color:var(--t2);line-height:1.7;white-space:pre-wrap}


  /* ---------- Tickets ---------- */
  .tk-row{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--b1);cursor:pointer;transition:background .1s}
  .tk-row:last-child{border-bottom:none}
  .tk-row:hover{background:var(--surface-2)}
  .tk-main{flex:1;min-width:0}
  .tk-title{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-display)}
  .tk-prev{font-size:12.5px;color:var(--t2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tk-count{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--t3);flex-shrink:0}
  .tk-count svg{width:13px;height:13px}
  .blocked-tag{margin-left:7px;font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:8px;vertical-align:middle}
  .recurring-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--cat-aqua);background:var(--cat-aqua-bg);padding:2px 8px;border-radius:8px;white-space:nowrap}
  .recurring-tag svg{width:11px;height:11px}
  .status-badge{padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .tk-idrow{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .tk-id{font-weight:800;font-size:13.5px;color:var(--accent);font-family:var(--font-display);letter-spacing:.01em}
  .tk-meta{font-size:11px;color:var(--t3);margin-top:4px}
  .priority-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:8px;white-space:nowrap}
  .priority-badge.pr-high{color:var(--warn);background:var(--warn-bg)}
  .priority-badge.pr-highest{color:var(--danger);background:var(--danger-bg)}
  .notif-ticket-id{font-weight:800;color:var(--accent);font-family:var(--font-display);font-size:12px;margin-right:6px}

  /* ticket detail / chat */
  .chat-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--b1)}
  .chat-body{padding:20px;display:flex;flex-direction:column;gap:14px;min-height:200px}
  .msg{max-width:78%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .msg .mt{font-size:10.5px;color:var(--t3);margin-top:5px}
  .msg.in{align-self:flex-end;background:var(--accent-grad);color:#fff;border-bottom-right-radius:4px}
  .msg.in .mt{color:rgba(255,255,255,.8)}
  .msg.out{align-self:flex-start;background:var(--surface-2);border:1px solid var(--b1);border-bottom-left-radius:4px}
  .composer{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--b1);background:var(--card)}
  .composer textarea{flex:1;resize:none;border:1px solid var(--b1);border-radius:12px;padding:11px 14px;max-height:120px}
  .composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .composer-wrap{border-top:1px solid var(--b1);background:var(--card)}
  .composer-extra{padding:12px 20px 0}
  .composer-tools{display:flex;align-items:center;gap:6px;padding:10px 20px 0;flex-wrap:wrap}
  .ctool-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;border:1px solid var(--b1);background:var(--card);color:var(--t2);font-size:12.5px;font-weight:600;transition:background .12s,border-color .12s}
  .ctool-btn:hover{background:var(--surface-2);border-color:var(--b2);color:var(--t1)}
  .ctool-btn svg{width:15px;height:15px}
  .ctool-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .cnotes-ta{width:100%;resize:vertical;min-height:56px;border:1px solid var(--b1);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px}
  .cnotes-ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .catt-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .catt-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--b1);border-radius:8px;background:var(--surface-2);font-size:12px;color:var(--t2)}
  .catt-chip button{color:var(--t3);font-size:14px;line-height:1;padding:0 2px}
  .catt-chip button:hover{color:var(--danger)}
  .cvoice-bar{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--b1);border-radius:10px;margin-top:8px;background:var(--surface-2)}
  .cvoice-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);flex-shrink:0;animation:cvoicepulse 1.1s ease-in-out infinite}
  @keyframes cvoicepulse{0%,100%{opacity:1}50%{opacity:.35}}
  .cvoice-timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;margin-right:auto}
  .cvoice-bar audio{height:32px;flex:1;min-width:0}
  .mention-menu{position:absolute;bottom:100%;left:20px;margin-bottom:6px;background:var(--card);border:1px solid var(--b1);border-radius:10px;box-shadow:var(--shadow-lg);max-height:220px;overflow-y:auto;width:240px;display:none;z-index:30}
  .mention-menu.show{display:block}
  .mention-item{display:flex;flex-direction:column;padding:9px 12px;cursor:pointer}
  .mention-item:hover{background:var(--surface-2)}
  .mention-item b{font-size:13px}
  .mention-item span{font-size:10.5px;color:var(--t3)}
  /* message meta: transcript / loom card / notes / assignee chips inside a bubble */
  .msg-transcript{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.16);font-size:12.5px;font-style:italic}
  .msg.out .msg-transcript{background:var(--surface-3)}
  .msg-loom{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px;border-radius:10px;background:rgba(255,255,255,.16);text-decoration:none}
  .msg.out .msg-loom{background:var(--surface-3)}
  .msg-loom img{width:56px;height:36px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--surface-3)}
  .msg-loom-title{font-weight:700;font-size:12.5px}
  .msg-loom-cta{font-size:11px;opacity:.85}
  .msg-notes{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.12);font-size:12px}
  .msg.out .msg-notes{background:var(--surface-2)}
  .msg-att-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .msg-att{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.18);font-size:11.5px;text-decoration:underline}
  .msg.out .msg-att{background:var(--surface-3)}
  .msg-author{font-size:11px;font-weight:700;margin-bottom:3px;opacity:.85}
  .msg-deleted{display:flex;align-items:center;gap:6px;font-style:italic;opacity:.65}
  .msg-deleted svg{width:13px;height:13px;flex-shrink:0}
  .msg-actions{display:flex;gap:12px;margin-top:6px}
  .msg-actions button{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.8);opacity:.85;text-decoration:none}
  .msg-actions button:hover{opacity:1;text-decoration:underline}
  .msg.out .msg-actions button{color:var(--t3)}
  .msg-edit-box{width:100%}
  .msg-edit-box .cnotes-ta{background:rgba(255,255,255,.95);color:var(--t1);margin-top:8px}
  .msg-edit-box .cnotes-ta:first-child{margin-top:0}
  .unread-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .assignee-row{display:flex;align-items:center;gap:8px;margin-top:6px}
  .assignee-av{width:24px;height:24px;border-radius:50%;background:var(--accent-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;overflow:hidden;flex-shrink:0}
  .assignee-av img{width:100%;height:100%;object-fit:cover}

  /* team */
  .team-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .tm{padding:22px 20px;text-align:center}
  .tm-av{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;background:var(--accent-grad);
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;overflow:hidden;font-family:var(--font-display)}
  .tm-av img{width:100%;height:100%;object-fit:cover}
  .tm-name{font-weight:600;font-size:15px;font-family:var(--font-display)}
  .tm-role{color:var(--t2);font-size:12.5px;margin-top:2px}
  .avail{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;margin-top:10px}
  .avail .d{width:7px;height:7px;border-radius:50%}

  /* meetings */
  .mt-row{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--b1)}
  .mt-row:last-child{border-bottom:none}
  .mt-date{width:56px;text-align:center;flex-shrink:0}
  .mt-date .d{font-size:22px;font-weight:700;line-height:1;font-family:var(--font-display)}
  .mt-date .m{font-size:11px;color:var(--t3);font-weight:700;text-transform:uppercase}

  /* notifications panel */
  .notif-panel{position:absolute;top:58px;right:20px;width:360px;max-height:70vh;overflow-y:auto;background:var(--card);
    border:1px solid var(--b1);border-radius:14px;box-shadow:var(--shadow-lg);z-index:50;display:none}
  .notif-panel.show{display:block}
  .notif-item{padding:13px 16px;border-bottom:1px solid var(--b1)}
  .notif-item:last-child{border-bottom:none}
  .notif-item.unread{background:var(--accent-soft)}
  .notif-t{font-weight:700;font-size:13px}
  .notif-b{font-size:12.5px;color:var(--t2);margin-top:2px}

  .empty{text-align:center;padding:32px 20px}
  .empty-ico{width:44px;height:44px;border-radius:50%;background:var(--surface-2);color:var(--t3);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .empty-ico svg{width:20px;height:20px}
  .empty-ico-danger{background:var(--danger-bg);color:var(--danger)}
  .empty-t{font-weight:600;color:var(--t1);font-size:14px}
  .empty-sub{margin-top:4px;color:var(--t3);font-size:12.5px}
  .skel{padding:40px;text-align:center;color:var(--t3)}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-bg.show{display:flex}
  .modal{width:100%;max-width:440px;background:var(--card);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-lg)}
  .toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:200}
  .toast{background:var(--t1);color:#fff;padding:12px 16px;border-radius:var(--radius-sm);font-size:13.5px;box-shadow:var(--shadow-lg);animation:slidein .25s}
  @keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

  /* ---------- Responsive: Desktop 1440+ / Tablet 768-1439 / Mobile 320-767 ---------- */
  .mnav{display:none}
  /* Tablet: sidebar collapses to a bottom nav, content goes single-column,
     but layout stays intentional (not a shrunk desktop) — grids that were
     multi-column on desktop drop to what actually fits at this width. */
  @media(max-width:1439px){
    .perf-grid{grid-template-columns:1fr}
    .content-inner{max-width:820px}
  }
  @media(max-width:1023px){
    .shell.show{grid-template-columns:1fr}
    .side{display:none}
    .content{padding:22px 20px 92px}
    .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--b1);
      z-index:40;justify-content:space-around;align-items:center;padding:0 4px}
    .mnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--t3);font-size:9.5px;font-weight:600;padding:6px 10px;border-radius:var(--radius-sm)}
    .mnav a svg{width:20px;height:20px}
    .mnav a.active{color:var(--accent)}
  }
  @media(max-width:767px){
    .content{padding:18px 16px 90px}
    .content-inner{max-width:100%}
    .topbar{padding:0 18px}
    .page-head{margin-bottom:20px}
    .page-head h1{font-size:20px}
    .health-card{grid-template-columns:1fr;text-align:center;gap:16px;justify-items:center;padding:22px 20px}
    .hc-right{align-items:center;text-align:center;max-width:100%}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .projects,.cw-grid,.rp-grid,.gtm-grid,.gtm-leads-grid{grid-template-columns:1fr}
    .donut-mini-wrap{flex-direction:column;align-items:flex-start}
    .notif-panel{right:8px;left:8px;width:auto}
    .msg{max-width:88%}
  }
  @media(max-width:480px){
    .kpis{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ===================== AUTH ===================== -->
<div class="auth-wrap" id="auth">
  <div class="auth-card">
    <div class="brand"><img class="brand-logo" src="logo/meridian.png" alt="Meridian"></div>

    <!-- login -->
    <div id="login-view">
      <div class="auth-h">Welcome back</div>
      <div class="auth-sub">Sign in to your client portal.</div>
      <div class="err" id="login-err"></div>
      <div class="field"><label>Email</label><input id="li-email" type="email" autocomplete="username" placeholder="you@company.com"></div>
      <div class="field"><label>Password</label><input id="li-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-block" id="li-btn" onclick="doLogin()">Sign in</button>
    </div>

    <!-- set / change password -->
    <div id="setup-view" style="display:none">
      <div class="auth-h" id="setup-h">Set your password</div>
      <div class="auth-sub" id="setup-sub">Choose a password to access your portal.</div>
      <div class="err" id="setup-err"></div>
      <div class="field" id="cur-field" style="display:none"><label>Current password</label><input id="sp-cur" type="password"></div>
      <div class="field"><label>New password</label><input id="sp-new" type="password" placeholder="At least 8 characters"></div>
      <div class="field"><label>Confirm password</label><input id="sp-confirm" type="password"></div>
      <button class="btn btn-primary btn-block" id="sp-btn" onclick="doSetPassword()">Save password</button>
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div class="shell" id="shell">
  <aside class="side">
    <div class="brand"><img class="brand-logo" src="logo/meridian.png" alt="Meridian"></div>
    <a class="nav-item" data-view="overview" onclick="nav('overview')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Overview</span></a>
    <a class="nav-item" data-view="services" onclick="nav('services')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Services</span></a>
    <a class="nav-item" data-view="tickets" onclick="nav('tickets')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.3A8 8 0 1 1 21 12Z"/></svg><span>Tickets</span></a>
    <a class="nav-item" data-view="performance" onclick="nav('performance')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m23 6-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg><span>Performance</span></a>
    <a class="nav-item" data-view="reports" onclick="nav('reports')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M9.5 13h5M9.5 17h5"/></svg><span>Reports</span></a>
    <a class="nav-item" data-view="team" onclick="nav('team')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2A3.2 3.2 0 0 1 16 11"/><path d="M17 20a5.5 5.5 0 0 0-3-4.9"/></svg><span>Team</span></a>
    <a class="nav-item" data-view="meetings" onclick="nav('meetings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Request a Meeting</span></a>
    <div class="nav-spacer"></div>
    <div class="side-foot">
      <div class="me-row">
        <div class="me-av" id="me-av">C</div>
        <div style="min-width:0;flex:1"><div class="me-name" id="me-name">Client</div><div class="me-sub">Client Portal</div></div>
        <button class="bell" title="Sign out" onclick="logout()" style="width:34px;height:34px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M15 4h4v16h-4"/><path d="M10 12H3m0 0 3.5-3.5M3 12l3.5 3.5"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="preview-banner" id="preview-banner" style="display:none"></div>
    <div class="topbar">
      <div class="pg-title" id="pg-title">Overview</div>
      <div class="tb-right">
        <button class="bell" onclick="toggleNotif(event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dot" id="notif-dot">0</span></button>
      </div>
    </div>
    <div class="notif-panel" id="notif-panel"></div>
    <div class="content"><div class="content-inner">
      <div class="page-head" id="page-head"></div>
      <div id="view"></div>
    </div></div>
  </div>

  <nav class="mnav">
    <a data-view="overview" onclick="nav('overview')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</a>
    <a data-view="tickets" onclick="nav('tickets')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.3A8 8 0 1 1 21 12Z"/></svg>Tickets</a>
    <a data-view="reports" onclick="nav('reports')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M9.5 13h5M9.5 17h5"/></svg>Reports</a>
    <a data-view="team" onclick="nav('team')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2A3.2 3.2 0 0 1 16 11"/><path d="M17 20a5.5 5.5 0 0 0-3-4.9"/></svg>Team</a>
    <a data-view="meetings" onclick="nav('meetings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Meet</a>
  </nav>
</div>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast-wrap" id="toasts"></div>

<script src="/portal-app.js"></script>
</body>
</html>
